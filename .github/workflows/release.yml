# Tag `vX.Y.Z` → notarized macOS disk image attached to a GitHub Release.
#
# Not exercised until these repository secrets exist (Settings › Secrets and variables › Actions):
#   APPLE_TEAM_ID                 e.g. ABCDE12345
#   ASC_KEY_ID / ASC_ISSUER_ID    App Store Connect API key, used only to notarize, so the
#                                 Developer role is enough. Signing does not touch Apple's servers:
#                                 the Release config signs manually against the profile below.
#   ASC_API_KEY_P8                the .p8 contents, base64-encoded
#   MACOS_CERTIFICATE_P12         "Developer ID Application" certificate + key, .p12 base64-encoded
#   MACOS_PROVISION_PROFILE       the "Developer ID" .provisionprofile, base64-encoded. Made once in
#                                 the portal (Profiles › Developer ID) and good until 2044; the app
#                                 needs it because keychain-access-groups implies
#                                 application-identifier, which only a profile can grant.
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Developer ID, notarized)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26.*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE" && xcodebuild -version

      - name: Install XcodeGen and generate project
        run: brew install xcodegen && make gen

      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # An empty or truncated secret otherwise surfaces six minutes later as a cryptic
          # "SecKeychainItemImport: One or more parameters ... were not valid".
          [ -n "$P12_BASE64" ] || { echo "MACOS_CERTIFICATE_P12 is empty"; exit 1; }
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          [ -s "$RUNNER_TEMP/cert.p12" ] || { echo "MACOS_CERTIFICATE_P12 did not decode to anything"; exit 1; }
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          # Belt and braces: a leaf whose issuer is missing is not a *valid* identity, and only
          # valid ones are offered for signing. A .p12 from Keychain Access carries the leaf and
          # its key but not always the issuer. Both generations, because the current certificate
          # is G1 (expires 2027-02-01) and its replacement will be G2.
          for CA in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$CA.cer" -o "$RUNNER_TEMP/$CA.cer"
            security import "$RUNNER_TEMP/$CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign
          done
          # codesign: is what lets codesign reach the private key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # Print what is actually usable, so a signing failure below is diagnosable from the log.
          security find-identity -v -p codesigning
          # Stop here rather than at the export five minutes later. The certificate and its key
          # can live in different keychains on a developer's Mac, and Keychain Access then offers
          # only the identities it can pair up — which is how an Apple Development certificate
          # ends up in this secret instead of the Developer ID one.
          security find-identity -v -p codesigning | grep -q "Developer ID Application" \
            || { echo "MACOS_CERTIFICATE_P12 holds no \"Developer ID Application\" identity"; exit 1; }

      - name: App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$ASC_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Install the Developer ID provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE }}
        run: |
          PROFILE="$RUNNER_TEMP/sill.provisionprofile"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          # Read the identity out of the file rather than hard-coding it, so regenerating the
          # profile in the portal cannot silently sign the wrong thing.
          PLIST=$(security cms -D -i "$PROFILE")
          UUID=$(printf '%s' "$PLIST" | plutil -extract UUID raw -o - -)
          echo "profile $(printf '%s' "$PLIST" | plutil -extract Name raw -o - -) expires $(printf '%s' "$PLIST" | plutil -extract ExpirationDate raw -o - -)"
          # Xcode 16+ reads the first path; the second is where older toolchains look.
          for DIR in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
                     "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.provisionprofile"
          done
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Archive and export (Developer ID)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # No -allowProvisioningUpdates and no API key: the Release config in project.yml signs
          # against the profile installed above, so nothing here asks Apple for anything.
          xcodebuild -project Sill.xcodeproj -scheme Sill -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Sill.xcarchive" -quiet \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>provisioningProfiles</key><dict>
              <key>com.mrskiro.sill</key><string>$PROFILE_UUID</string>
            </dict>
          </dict></plist>
          PLIST
          # Manual, and without the API key: Xcode's cloud signing refuses to mint a Developer ID
          # profile for this key ("Cloud signing permission error"), and it has nothing to do here
          # now that the profile is installed above.
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Sill.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" -quiet

      - name: Notarize and build the disk image
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTARIZE=(--key "$RUNNER_TEMP/asc/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait)
          cd "$RUNNER_TEMP/export"

          # The app first. A ticket cannot be stapled to an archive, so the zip is only the
          # envelope the notary service accepts — the ticket lands on Sill.app itself, which is
          # what lets a copy dragged out of the image launch on a machine that is offline.
          ditto -c -k --keepParent Sill.app "$RUNNER_TEMP/Sill.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Sill.zip" "${NOTARIZE[@]}"
          xcrun stapler staple Sill.app

          # Then the thing people download. Deliberately plain: the app and a link to drop it
          # into, no background art to keep in step with the icon. Dragging it out of the image
          # is also what clears the quarantine flag, so the app is not run translocated from
          # a random read-only path the way a zip left in ~/Downloads would be.
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R Sill.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Sill -srcfolder "$STAGE" -ov -format UDZO -quiet "Sill-$VERSION.dmg"
          xcrun notarytool submit "Sill-$VERSION.dmg" "${NOTARIZE[@]}"
          xcrun stapler staple "Sill-$VERSION.dmg"
          shasum -a 256 "Sill-$VERSION.dmg" > "Sill-$VERSION.dmg.sha256"

      - name: Verify what will be published
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP/export"
          xcrun stapler validate "Sill-$VERSION.dmg"
          hdiutil attach -quiet -nobrowse -mountpoint "$RUNNER_TEMP/mnt" "Sill-$VERSION.dmg"
          # What Gatekeeper does when someone opens it: expect "accepted / Notarized Developer ID".
          # `install` would assess it as an installer package; an app is assessed as code.
          spctl -a -vvv --type execute "$RUNNER_TEMP/mnt/Sill.app"
          xcrun stapler validate "$RUNNER_TEMP/mnt/Sill.app"
          hdiutil detach -quiet "$RUNNER_TEMP/mnt"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/export/Sill-${GITHUB_REF_NAME#v}.dmg" \
            "$RUNNER_TEMP/export/Sill-${GITHUB_REF_NAME#v}.dmg.sha256" \
            --title "Sill $GITHUB_REF_NAME" --generate-notes
